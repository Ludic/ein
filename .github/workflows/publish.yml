name: Publish

# Publishes to npm through GitHub's OIDC token (npm "trusted publishing"), so no
# npm token is stored in the repository and provenance is attached automatically.
# One-time setup on npmjs.com: package @ludic/ein -> Settings -> Trusted publishing
# -> GitHub Actions, organization "Ludic", repository "ein", workflow
# "publish.yml", and allow direct `npm publish` under "Allowed actions".
#
# - pushing a `v*` tag publishes package.json's version as `latest`
# - pushing to master publishes `<version>-dev.<sha>` under the `dev` dist-tag
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or newer (dist-tags 11.21); Node's bundled npm may lag.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Version the canary build
        if: github.ref == 'refs/heads/master'
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version")-dev.$(git rev-parse --short HEAD)"
      # prepublishOnly runs the full check (typecheck, lint, format, test, build) first.
      - run: npm publish --access public --tag ${{ startsWith(github.ref, 'refs/tags/') && 'latest' || 'dev' }}
