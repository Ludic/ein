name: Canary

# Publishes every push to master under the `dev` dist-tag, as the 1.x workflow did.
on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm version --no-git-tag-version "$(node -p "require('./package.json').version")-dev.$(git rev-parse --short HEAD)"
      - run: npm publish --tag dev --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
